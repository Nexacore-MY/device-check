<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Nexacore Device Check — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Quicksand:wght@500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
<!--
  BD demo pass landing page (schema-fix-17). A permanent QR code points here as
  /start/#c=<code>. Nothing happens on page load — link scanners in email and chat apps fetch
  links before people do, and the code sits in the #fragment so it is never sent to any server
  with the page request. Only a tap on "Start demo" calls demo_start_session, which returns a
  brand-new session token; the page then replaces itself with the normal app on that session.
-->
<style>
  :root {
    --white: #FFFFFF; --ice: #CEF1F2; --teal: #44C0C5; --deep-teal: #117F84; --dark: #06444A;
    --bg: #F6FBFB; --border: #E0EDED; --text-light: #5A8A8D; --danger: #EF4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Quicksand', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--white); }
  .header { background: var(--dark); color: var(--white); padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .header-logo { width: 36px; height: 36px; background: var(--teal); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 16px; color: var(--dark); }
  .header-title { font-family: 'Montserrat', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .header-subtitle { font-size: 11px; opacity: 0.6; font-weight: 500; }
  main { flex: 1; display: flex; flex-direction: column; padding: 24px 20px; }
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 32px 0; }
  .icon { width: 88px; height: 88px; margin: 0 auto 28px; border-radius: 24px; background: linear-gradient(135deg, var(--teal), var(--deep-teal)); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(68,192,197,0.25); }
  .icon svg { width: 44px; height: 44px; fill: var(--white); }
  h1 { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
  .lead { color: var(--text-light); font-size: 15px; line-height: 1.6; font-weight: 500; max-width: 320px; margin: 0 auto; }
  .needs { margin: 28px auto 0; max-width: 320px; text-align: left; background: var(--ice); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.6; font-weight: 600; }
  .needs li { margin-left: 18px; }
  .msg { min-height: 24px; margin: 16px 0 12px; text-align: center; font-size: 14px; font-weight: 600; line-height: 1.5; }
  .msg.error { color: var(--danger); }
  .btn { width: 100%; padding: 16px 24px; border: none; border-radius: 999px; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.2px; cursor: pointer; background: var(--teal); color: var(--white); box-shadow: 0 4px 12px rgba(68,192,197,0.3); transition: background 0.2s; }
  .btn:hover { background: var(--deep-teal); }
  .btn:disabled { background: var(--border); color: var(--text-light); box-shadow: none; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-logo">N</div>
    <div>
      <div class="header-title">Device Check</div>
      <div class="header-subtitle">by Nexacore</div>
    </div>
  </div>
  <main>
    <div class="hero">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17 1H7a2 2 0 00-2 2v18a2 2 0 002 2h10a2 2 0 002-2V3a2 2 0 00-2-2zm-3 20h-4v-1h4v1zm3-3H7V4h10v14z"/></svg>
      </div>
      <h1>Try Device Check</h1>
      <p class="lead">A live demo of the check your customers would do. It takes about three minutes.</p>
      <ul class="needs">
        <li>This phone, for the device check</li>
        <li>A second phone, for the condition photos</li>
      </ul>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <button class="btn" id="startBtn" type="button">Start demo</button>
  </main>
</div>
<script>
(function () {
  // Same project and publishable key as the app (index.html). The key goes in the apikey
  // header only: the new sb_publishable_ keys are not JWTs, so not in Authorization: Bearer.
  const SUPABASE_URL = 'https://rysbsztwxjwndwebguuj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Ca2iyY__GqNRUw2tYweqXg_Qz6DAzpi';

  const MESSAGES = {
    no_code: 'This page needs a demo link. Scan the QR code from your Nexacore contact.',
    demo_link_invalid: 'This demo link is no longer active. Ask your Nexacore contact for a new one.',
    demo_limit_reached: 'This demo link has reached its limit for now. Please try again later, or ask your Nexacore contact.',
    network: 'Could not connect. Check your internet connection and tap Start demo again.'
  };

  const btn = document.getElementById('startBtn');
  const msg = document.getElementById('msg');
  const code = new URLSearchParams(location.hash.replace(/^#/, '')).get('c');

  function show(text, isError) {
    msg.textContent = text;
    msg.className = isError ? 'msg error' : 'msg';
  }

  if (!code) {
    btn.disabled = true;
    show(MESSAGES.no_code, true);
    return;
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;           // one tap = one session
    btn.textContent = 'Starting…';
    show('', false);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/demo_start_session`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_code: code }),
        signal: ctrl.signal
      });
      const body = await resp.json().catch(() => null);
      if (resp.ok && typeof body === 'string' && body.length >= 32) {
        // replace(): the start page leaves the history, so Back cannot re-mint.
        location.replace('/#s=' + encodeURIComponent(body));
        return;
      }
      const reason = body && body.message;
      if (reason === 'demo_link_invalid' || reason === 'demo_limit_reached') {
        show(MESSAGES[reason], true);
        btn.textContent = 'Start demo';
        return;                    // stays disabled: tapping again will not help
      }
      throw new Error('unexpected response ' + resp.status);
    } catch (e) {
      console.error('demo start failed:', e);
      show(MESSAGES.network, true);
      btn.disabled = false;
      btn.textContent = 'Start demo';
    } finally {
      clearTimeout(timer);
    }
  });
})();
</script>
</body>
</html>
